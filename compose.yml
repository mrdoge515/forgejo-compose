services:
  forgejo:
    image: data.forgejo.org/forgejo/forgejo:16-rootless@sha256:214f4ae63ee78be1e445e58573c88dc7215e72091210852e0df94eaac1a25685
    container_name: forgejo
    user: 1000:1000
    environment:
      FORGEJO__security__INSTALL_LOCK: "true"
    volumes:
      - data:/var/lib/gitea
    networks:
     - reverse-proxy
     - forgejo

  docker-in-docker:
    image: docker:29-dind@sha256:1cf1cad2a305cb46c39d4b5d2920508fe8a4b81a8dcd2963cae3d72f7f3c8ae3
    container_name: dind
    hostname: docker
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
      DOCKER_HOST: docker-in-docker
    volumes:
      - dind:/var/lib/docker
      - certs:/certs
    network:
      - forgejo

  runner:
    image: data.forgejo.org/forgejo/runner:13@sha256:ad6d9d0ae7759d70d2147cb2d2da8131b885595698bd1d429d29bc94f90030d8
    container_name: forgejo-runner
    links:
      - docker-in-docker
      - forgejo
    environment:
      DOCKER_HOST: tcp://docker:2376
      DOCKER_CERT_PATH: /certs/client
      DOCKER_TLS_VERIFY: "1"
    volumes:
      - runner:/data
      - certs:/certs
    depends_on:
     - runner-register
    command: >-
      forgejo-runner --config config.yml daemon
    networks:
      - forgejo

  # Needed for first run, you can delete it later
  runner-register:
    image: data.forgejo.org/forgejo/runner:13.1.0@sha256:c4af85fd9f0dd03788676a534781a87c71aa2c6a37737143e017eb94d4312952
    links:
      - docker-in-docker
      - forgejo
    environment:
      DOCKER_HOST: tcp://docker-in-docker:2376
    volumes:
      - runner:/data
    user: 0:0
    command: >-
      bash -ec '
      if [ -e config.yml ] ; then echo "config.yml already exists"; exit 0; fi;
      forgejo-runner generate-config > config.yml ;
      sed -i -e "s|  level: info|  level: debug|" config.yml ;
      sed -i -e "s|  labels: \[\]|  labels: [\"docker-cli:docker://code.forgejo.org/oci/docker:cli\", \"node:docker://code.forgejo.org/oci/node:lts\"]|" config.yml;
      sed -i -e "s|network: .*|network: host|" config.yml ;
      sed -i -e "s|^  envs:$$|  envs:\n    DOCKER_HOST: tcp://docker:2376\n    DOCKER_TLS_VERIFY: 1\n    DOCKER_CERT_PATH: /certs/client|" config.yml ;
      sed -i -e "s|^  options:|  options: -v /certs/client:/certs/client|" config.yml ;
      sed -i -e "s|  valid_volumes: \[\]$$|  valid_volumes:\n    - /certs/client|" config.yml ;
      sed -i -e "s|  connections:|  connections:\n    default:\n      url: http://forgejo:3000\n      uuid: 31393562-6435-6232-6166-386433613030\n      token: 195bd5b2af8d3a0091088d62cd4b313d43be7767|" config.yml ;
      chown -R 1000:1000 /data
      '

volumes:
  data:
  runner:
  certs:
  dind:

networks:
  reverse-proxy:
    external: true
  forgejo:
