networks:
  reverse-proxy:
    external: true
  forgejo:

volumes:
  docker_certs:

services:
  docker-in-docker:
    image: data.forgejo.org/oci/docker:dind
    hostname: docker  # Must set hostname as TLS certificates are only valid for docker or localhost
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
      DOCKER_HOST: docker-in-docker
    volumes:
      - docker_certs:/certs
    networks:
      - forgejo

  forgejo:
    image: data.forgejo.org/forgejo/forgejo:16.0
    command: >-
      bash -c '
      /usr/bin/s6-svscan /etc/s6 &
      sleep 10 ;
      su -c "forgejo forgejo-cli actions register --keep-labels --secret 195bd5b2af8d3a0091088d62cd4b313d43be7767" git ;
      sleep infinity
      '
    environment:
      FORGEJO__security__INSTALL_LOCK: "true"
      #FORGEJO__log__LEVEL: "debug"
    volumes:
      - /srv/forgejo-data:/data
    networks:
      - reverse-proxy
      - forgejo

  # Needed for first run
  runner-register:
    image: data.forgejo.org/forgejo/runner:13.1.0@sha256:c4af85fd9f0dd03788676a534781a87c71aa2c6a37737143e017eb94d4312952
    links:
      - docker-in-docker
      - forgejo
    environment:
      DOCKER_HOST: tcp://docker-in-docker:2376
    volumes:
      - /srv/runner-data:/data
    user: 0:0
    command: >-
      bash -ec '
      if [ -e config.yml ] ; then echo "config.yml already exists"; exit 0; fi;
      forgejo-runner generate-config > config.yml ;
      sed -i -e "s|  level: info|  level: debug|" config.yml ;
      sed -i -e "s|  labels: \[\]|  labels: [\"docker-cli:docker://code.forgejo.org/oci/docker:cli\", \"node:docker://code.forgejo.org/oci/node:lts\"]|" config.yml;
      sed -i -e "s|network: .*|network: host|" config.yml ;
      sed -i -e "s|^  envs:$$|  envs:\n    DOCKER_HOST: tcp://docker:2376\n    DOCKER_TLS_VERIFY: 1\n    DOCKER_CERT_PATH: /certs/client|" config.yml ;
      sed -i -e "s|^  options:|  options: -v /certs/client:/certs/client|" config.yml ;
      sed -i -e "s|  valid_volumes: \[\]$$|  valid_volumes:\n    - /certs/client|" config.yml ;
      sed -i -e "s|  connections:|  connections:\n    default:\n      url: http://forgejo:3000\n      uuid: 31393562-6435-6232-6166-386433613030\n      token: 195bd5b2af8d3a0091088d62cd4b313d43be7767|" config.yml ;
      chown -R 1000:1000 /data
      '

  runner-daemon:
    image: data.forgejo.org/forgejo/runner:13.1.0
    links:
      - docker-in-docker
      - forgejo
    environment:
      DOCKER_HOST: tcp://docker:2376
      DOCKER_CERT_PATH: /certs/client
      DOCKER_TLS_VERIFY: "1"
    volumes:
      - /srv/runner-data:/data
      - docker_certs:/certs
    restart: unless-stopped
    depends_on:
      - runner-register
    command: >-
      forgejo-runner --config config.yml daemon
    networks:
      - forgejo
